# Multi-experiment configuration for varying number of sensors

# Data sources
data_file: data/A13_Velocity_Data_0909-0910.txt
distance_json: td_data/2024-09-09.json

# Model architecture
layers: [2, 20, 20, 20, 20, 20, 20, 20, 20, 1]

# Physics collocation points
N_f: 10000
physics_every: 1
f_weight: 1.0    # weight for physics loss term

# Optimization
epochs: 10000
lr: 0.0001
log_every: 200
patience: 2000
seed: 25

# Experiment grid
num_runs: 5
sensor_list: [3,5,7,10,15]

# Output directories and files
base_run_dir: Results/runs/a13_multi
results_out: Results/summary/a13_multi_results.csv
summary_out: Results/summary/a13_multi_summary.csv

# Fast mode for smoke tests (reduces epochs and N_f)
fast: false
  